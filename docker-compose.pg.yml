name: corn-app

services:
  postgres:
    image: postgres:16-alpine
    container_name: corn-app
    restart: unless-stopped
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d main"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
